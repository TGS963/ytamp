name: Release desktop packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.platform }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            binary: target/release/ytamp
            staging: dist/ytamp-linux-x86_64
            archive: dist/ytamp-linux-x86_64.tar.gz
          - platform: windows
            runner: windows-2025
            binary: target/release/ytamp.exe
            staging: dist/ytamp-windows-x86_64
            archive: dist/ytamp-windows-x86_64.zip
          - platform: macos
            runner: macos-15
            staging: dist/ytamp-macos-universal.app
            archive: dist/ytamp-macos-universal.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python - <<'PYTHON'
          import os, tomllib
          with open('Cargo.toml', 'rb') as file:
              version = tomllib.load(file)['package']['version']
          if os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Release tag must match the Cargo package version.')
          PYTHON
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Install macOS Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Linux desktop libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release
          cache-on-failure: true
      - name: Build native release binary
        if: matrix.platform != 'macos'
        run: cargo build --locked --release
      - name: Stage native package
        if: matrix.platform != 'macos'
        run: python scripts/package.py --platform ${{ matrix.platform }} --binary ${{ matrix.binary }} --output ${{ matrix.staging }}
      - name: Archive Linux package
        if: matrix.platform == 'linux'
        run: tar -C dist -czf ${{ matrix.archive }} ytamp-linux-x86_64
      - name: Archive Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path ${{ matrix.staging }} -DestinationPath ${{ matrix.archive }}
      - name: Build universal macOS binary
        if: matrix.platform == 'macos'
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/ytamp-universal target/aarch64-apple-darwin/release/ytamp target/x86_64-apple-darwin/release/ytamp
          lipo dist/ytamp-universal -verify_arch arm64 x86_64
          lipo -info dist/ytamp-universal
          python3 scripts/package.py --platform macos --binary dist/ytamp-universal --output ${{ matrix.staging }}
          ditto -c -k --sequesterRsrc --keepParent ${{ matrix.staging }} ${{ matrix.archive }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ytamp-${{ matrix.platform }}-package
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Draft GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > draft-status 2>/dev/null; then
            if [ "$(cat draft-status)" != true ]; then
              echo "Refusing to modify published release $GITHUB_REF_NAME" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --draft --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
