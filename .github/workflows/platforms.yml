name: Checks

on:
  push:
    branches: [master]
    paths: &code_paths
      - 'src/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'scripts/**'
      - 'packaging/**'
      - 'docs/map/**'
      - '.github/workflows/**'
  pull_request:
    paths: *code_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
      - name: Install build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: checks
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Check formatting and map
        run: |
          cargo fmt --all -- --check
          python3 scripts/check-map.py --check
      - name: Check Clippy
        run: cargo clippy --locked --lib --bin ytamp -- -D warnings
      - name: Test library
        run: cargo test --locked --lib
