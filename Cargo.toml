[package]
name = "ytamp"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "YouTube Music, native and fast. A client with no browser engine."
repository = "https://github.com/TGS963/ytamp"

[dependencies]
bytes = "1.12.1"
directories = "6.0.0"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "persistence", "links"] }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["image", "http"] }
env_logger = "0.11.11"
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
fastrand = "2.5.0"
log = "0.4.34"
reqwest = "0.13.4"
rodio = "0.22.2"
raw-window-handle = "0.6"
rustypipe = { version = "0.11.4" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Reading the bundled Inter face's glyph outlines for the Winamp
# playlist's text (src/ui/winamp/pixel_text.rs). The version tracks
# epaint's own skrifa, so the binary does not compile two copies of it.
skrifa = "0.44"
souvlaki = "0.8.3"
# Filling glyph outlines with no anti-aliasing for the Winamp
# playlist's text (src/ui/winamp/pixel_text.rs).
tiny-skia = "0.11"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
ytmapi-rs = { version = "0.3.3", features = ["reqwest", "serde_json"] }

[profile.release]
lto = "thin"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSData"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSImage", "NSApplication", "NSMenu", "NSMenuItem", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "objc2-core-foundation"] }

[build-dependencies]
winresource = "0.1.31"
