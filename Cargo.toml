[package]
name = "ytamp"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "YouTube Music, native and fast. A client with no browser engine."
repository = "https://github.com/suvojit-0x55aa/ytamp"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "persistence"] }
egui = "0.36"
env_logger = "0.11.11"
fastrand = "2.5.0"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
