[package]
name = "ytamp"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "YouTube Music, native and fast. A client with no browser engine."
repository = "https://github.com/suvojit-0x55aa/ytamp"

[dependencies]
bytes = "1.12.1"
directories = "6.0.0"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "persistence", "links"] }
egui = "0.36"
env_logger = "0.11.11"
fastrand = "2.5.0"
log = "0.4.34"
reqwest = "0.13.4"
rodio = "0.22.2"
rustypipe = { version = "0.11.4" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
souvlaki = "0.8.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
ytmapi-rs = { version = "0.3.3", features = ["reqwest", "serde_json"] }

[profile.release]
lto = "thin"
strip = true
